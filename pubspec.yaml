name: docscan
description: "Smart Document Scanner & Enhancer mobile application for iOS and Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image: ^4.2.0
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  image_picker: ^1.1.2
  camera: ^0.11.0+1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
